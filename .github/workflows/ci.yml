name: Julia tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia: ['1.10', '1.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Install Sollya on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sollya libsollya-dev
      - name: Install Sollya on macOS
        if: runner.os == 'macOS'
        run: |
          brew install sollya
          echo "SOLLYA_LIBRARY=$(brew --prefix sollya)/lib/libsollya.dylib" >> "$GITHUB_ENV"
      - uses: julia-actions/cache@v2
      - name: Package tests, including threads and worker processes
        run: julia --project=. --startup-file=no --threads=4 -e 'using Pkg; Pkg.test()'
